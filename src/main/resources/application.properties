spring.application.name=nexacorp-ai-backend
server.port=8085
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
logging.level.org.springframework.ai.vectorstore.redis=DEBUG

## Groq API configuration
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Embeddings ? Gemini
# Gemini embeddings
spring.ai.model.embedding=google-genai
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001

spring.datasource.url=jdbc:postgresql://localhost:5432/sbscorp-knowledge
spring.datasource.username=abdellah
spring.datasource.password=abdellah
spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.redis.host=localhost
spring.data.redis.port=6379
